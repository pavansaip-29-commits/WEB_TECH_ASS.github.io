<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prime Check</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><nav class="nav"><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav>
<div class="container"><h1>Prime Check</h1><div class='card'><p>Working demonstration:</p><div id='out' class='output'>Click Run to execute.</div><button id='btn'>Run</button></div><script>let n=17,p=n>1; for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0)p=false; document.getElementById('out').textContent=p?'Prime':'Not Prime';</script></div></body></html>
