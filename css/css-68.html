<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading Spinner</title><link rel="stylesheet" href="../assets/style.css"></head>
<body><nav class="nav"><a href="../index.html">Home</a><a href="index.html">Back to Programs</a></nav>
<div class="container"><h1>Loading Spinner</h1><div class='spinner'></div><style>
.demo{padding:18px;background:#e8f0ff;border:2px solid #1456c0;margin:12px 0}.colors{background:#dbeafe;color:#111827;border:4px solid #1456c0}
.fontdemo{font-family:Georgia;font-size:24px;font-weight:bold;text-transform:uppercase;letter-spacing:2px}.boxmodel{margin:30px;border:8px solid #1456c0;padding:25px;background:#e8f0ff}
.positionbox{position:relative;left:20px;padding:15px;background:#dbeafe}.floatbox{float:left;background:#1456c0;color:white;padding:25px;margin-right:15px}
.sample-nav{display:flex;gap:20px;background:#111827;padding:15px}.sample-nav a{color:white;text-decoration:none}.pseudo:hover{background:#ffe08a}.pseudo:focus{outline:3px solid #1456c0}
.pseudoel::before{content:"CSS ";color:#1456c0}.pseudoel::first-letter{font-size:200%}.flexdemo{display:flex;gap:12px}.flexdemo div,.griddemo div{padding:25px;background:#dbeafe}.griddemo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.transition{padding:25px;background:#dbeafe;transition:.5s}.transition:hover{transform:scale(1.1);background:#1456c0;color:white}.animate{width:100px;padding:20px;background:#1456c0;color:white;animation:move 2s infinite alternate}
@keyframes move{to{transform:translateX(200px)}}.product{padding:20px;border-radius:15px;box-shadow:0 5px 20px #0002;max-width:280px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.photo-grid img{width:100%}
.varbox{--c:#1456c0;color:white;background:var(--c);padding:25px}.gradient{padding:30px;margin:10px}.linear{background:linear-gradient(90deg,#dbeafe,#1456c0);color:white}.radial{background:radial-gradient(circle,#fff,#1456c0);color:white}.shadow{padding:30px;box-shadow:10px 10px 20px #0003}.textshadow{text-shadow:3px 3px 4px #999}.shape{display:inline-block;width:100px;height:100px;background:#1456c0;margin:10px}.circle{border-radius:50%}.round{border-radius:25px}
.dropdown{position:relative;display:inline-block}.dropcontent{display:none;position:absolute;background:white;box-shadow:0 4px 15px #0003}.dropcontent a{display:block;padding:10px}.dropdown:hover .dropcontent{display:block}.hoverimg{width:100%;max-width:500px;transition:.5s}.hoverimg:hover{transform:scale(1.05);filter:brightness(1.2)}
.tooltip{position:relative;display:inline-block;padding:20px;background:#dbeafe}.tiptext{display:none;position:absolute;bottom:100%;left:0;background:#111827;color:white;padding:8px}.tooltip:hover .tiptext{display:block}
.filters{display:flex;gap:10px;flex-wrap:wrap}.filters img{max-width:30%}.blur{filter:blur(4px)}.gray{filter:grayscale(1)}.mobilefirst{padding:20px;background:#dbeafe}.spinner{width:55px;height:55px;border:7px solid #ddd;border-top-color:#1456c0;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.slidecard{padding:25px;background:#dbeafe;animation:slide 3s infinite alternate}@keyframes slide{to{transform:translateX(250px)}}.modal{display:none;background:white;padding:30px;margin-top:15px;box-shadow:0 10px 30px #0004}.dark{background:#111827;color:white}.responsive-title{font-size:clamp(24px,6vw,60px)}.calcbox{width:calc(100% - 40px);padding:20px;background:#dbeafe}.complete{display:grid;grid-template-columns:1fr 2fr;padding:30px;background:linear-gradient(135deg,#dbeafe,#fff)}@media(max-width:600px){.complete{grid-template-columns:1fr}.filters img{max-width:100%}}
</style></div></body></html>
